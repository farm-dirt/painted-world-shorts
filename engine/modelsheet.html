<!doctype html><html><head><meta charset="utf-8">
<style>body{margin:0}canvas{display:block}</style></head><body>
<canvas id="c" width="2400" height="2000"></canvas>
<script src="characters.js"></script>
<script src="custom.js" onerror="void 0"></script>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const {drawCharacter, CAST} = PT;
const g = ctx.createLinearGradient(0,0,0,2000); g.addColorStop(0,'#f6e3c8'); g.addColorStop(1,'#d9c7b4');
ctx.fillStyle = g; ctx.fillRect(0,0,2400,2000);
ctx.font = 'bold 34px sans-serif'; ctx.fillStyle = '#3a2a2a';
ctx.fillText('painted-world-shorts — cast (front / 3-quarter)', 40, 60);
const ids = (new URLSearchParams(location.search).get('ids') || Object.keys(CAST).join(',')).split(',');
const H = 760, step = 2360 / ids.length;
ids.forEach((id, i) => {
  const x0 = 40 + step * i + step * 0.3;
  drawCharacter(ctx, id, x0, 960, H, {face:'happy'});
  drawCharacter(ctx, id, x0 + step * 0.42, 960, H, {view:'side', face:'neutral', armL:[0.1,0.2], armR:[-0.1,0.3]});
  ctx.fillStyle = '#3a2a2a'; ctx.font = 'bold 30px sans-serif';
  ctx.fillText(((CAST[id]) || (window.CUSTOM && window.CUSTOM.cast && window.CUSTOM.cast[id]) || {}).name || id, x0 - 60, 1010);
});
ctx.font = 'bold 34px sans-serif'; ctx.fillText(ids[0] + ' — expressions', 40, 1070);
const faces = ['neutral','happy','grin','shock','angry','worried','sad','smug','awe','scared'];
faces.forEach((f, i) => {
  const x = 120 + i * 230;
  ctx.save(); ctx.beginPath(); ctx.rect(x - 112, 1090, 224, 300); ctx.clip();
  drawCharacter(ctx, ids[0], x, 2380, 1250, {face:f, talk:0.9, look: f==='smug'?[0.5,0]:[0,0]});
  ctx.restore();
  ctx.fillStyle = '#3a2a2a'; ctx.font = '26px sans-serif'; ctx.fillText(f, x - 40, 1420);
});
const poses = [
  [ids[0], {view:'side', walk:0.9, face:'happy', armL:[-0.5,0.3], armR:[0.5,0.4]}, 'walk'],
  [ids[0], {face:'shock', squash:1.08, hop:30, armL:[2.4,0.3], armR:[2.4,0.3]}, 'double-take'],
  [ids[0], {face:'worried', armL:[0.5,1.7], armR:[0.5,1.7], headTilt:-0.12}, 'shrug'],
  [ids[1]||ids[0], {face:'smug', armL:[0.9,-1.9], armR:[0.9,-1.9]}, 'hands on hips'],
  [ids[0], {view:'side', facing:-1, face:'grin', walk:2.2, armL:[-0.9,0.4], armR:[1.0,0.6], hop:20}, 'run (facing left)'],
  [ids[0], {face:'awe', armR:[2.6,0.2], look:[0.3,-0.6]}, 'hold up'],
];
poses.forEach(([id,p,label], i) => {
  const x = 170 + i * 390;
  drawCharacter(ctx, id, x, 1940, 460, p);
  ctx.fillStyle = '#3a2a2a'; ctx.font = '26px sans-serif'; ctx.fillText(label, x - 60, 1985);
});
window.DONE = true;
</script></body></html>
